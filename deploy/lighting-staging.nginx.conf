# Optional private preview. Reach only through an SSH tunnel; use a separate DB.
server {
    listen 127.0.0.1:8793;
    server_name localhost;
    root /var/www/EH_app-lighting-stage/public;
    index index.php;
    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /_protected-audio/ {
        internal;
        alias /var/www/EH_app-lighting-stage/storage/app/private/;
        types {
            audio/mpeg mp3;
            audio/mp4 m4a aac;
            audio/ogg ogg oga;
            audio/wav wav;
            audio/flac flac;
        }
        default_type application/octet-stream;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
